<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>laminator - log in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body class="login">
  <form method="post" action="/login" class="box loginbox">
    <img src="/static/logo.svg?v={{ asset_v }}" alt="">
    <span class="wordmark">LAMINATOR</span>
    <span class="tag">Shield the surface. Elevate the finish.</span>
    <span class="tag ver-line">v{{ app_version }}</span>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <label>Password <input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <button class="btn">Log in</button>
  </form>
</body>
</html>
