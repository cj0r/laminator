name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the oldest laminator runs on; 3.13 is what the image uses
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest -q

  audit:
    # known vulnerabilities in the pinned dependencies; a separate job so a newly published advisory never blocks an unrelated change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip-audit -r requirements.txt
