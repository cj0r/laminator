# Copy to config.local.yaml (gitignored). Keys come from the environment:
#   API_EMBY       Emby API key        (API_JELLYFIN for a Jellyfin server)
#   API_MDBLIST    MDBList API key
#   LAMINATOR_ADMIN_PASSWORD   password for the web UI (laminator serve)
server:
  kind: emby
  url: http://CHANGE-ME:8096
  library: Movies

# Also write the score into Emby's "CriticRating" field (0-100, locked so refreshes keep it).
# Emby leaves that field empty by default. Off unless you turn it on; undo with: laminator restore --what meta --all
critic_rating: false

# A second server (e.g. Jellyfin) gets its own config file, its own key variable and its own data folder:
#   data_dir: data-jellyfin
#   server: {kind: jellyfin, url: http://HOST:8096, key_env: API_JELLYFIN}
# then run:  laminator -c config.local.jellyfin.yaml scan --list-libraries

# Emby AND Jellyfin together (one server per kind). Everything here can also be set in the web UI (Settings), which overrides this file:
# servers:
#   emby:     {url: "http://192.168.1.10:8096", library: Movies}
#   jellyfin: {url: "http://192.168.1.11:8096", enabled: true}
# Keys: API_EMBY, API_JELLYFIN, API_MDBLIST. With both configured, CLI commands need --server emby|jellyfin|all.
